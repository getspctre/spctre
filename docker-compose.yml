services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: spctre
      POSTGRES_USER: spctre
      POSTGRES_PASSWORD: spctre
      PGDATA: /var/lib/postgresql/data/18
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spctre -d spctre"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgres://spctre:spctre@db:5432/spctre
      SPCTRE_CREDENTIAL_ENCRYPTION_KEY: ${SPCTRE_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://spctre:spctre@db:5432/spctre
      NODE_ENV: production
      SPCTRE_SESSION_GUARD_SECRET: local-dev-session-guard-secret
      SPCTRE_EVIDENCE_INGEST_URL: http://worker:18080
      SPCTRE_WORKER_INTERNAL_SECRET: local-dev-worker-internal-secret
      SPCTRE_E2E_API_ENABLED: "true"
      GATEWAY_ENABLED: "true"
      GATEWAY_MODE: HYBRID
      SPCTRE_RATE_LIMIT_MAX_REQUESTS: "1000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:3000/api/health'',res=>process.exit(res.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "18080:18080"
    environment:
      DATABASE_URL: postgres://spctre:spctre@db:5432/spctre
      WORKER_HTTP_PORT: "18080"
      GATEWAY_ENABLED: "true"
      GATEWAY_MODE: ${GATEWAY_MODE:-HYBRID}
      SPCTRE_WORKER_INTERNAL_SECRET: local-dev-worker-internal-secret
      SPCTRE_DEMO_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      SPCTRE_E2E_API_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      SPCTRE_MCP_TRANSPORT: http
      SPCTRE_MCP_HTTP_PORT: "3100"
      SPCTRE_API_URL: http://web:3000
      SPCTRE_API_TOKEN: ${SPCTRE_API_TOKEN:-}
      SPCTRE_WORKSPACE_ID: ${SPCTRE_MCP_WORKSPACE_ID:-00000000-0000-0000-0000-000000000002}
      SPCTRE_AGENT_ID: mcp-server
      SPCTRE_MCP_REQUIRE_BEARER_AUTH: "false"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
