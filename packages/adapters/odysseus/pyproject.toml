[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spctre-odysseus"
dynamic = ["version"]
description = "Spctre ToolMiddleware adapter for Odysseus"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23",
  "pyrefly==1.1.0",
]

# Single source of truth for the version: spctre_odysseus.__version__ is
# exported on the package and is what the release workflow rewrites for
# TestPyPI dev builds. Keeping it out of this file avoids bump drift.
[tool.hatch.version]
path = "spctre_odysseus/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["spctre_odysseus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
