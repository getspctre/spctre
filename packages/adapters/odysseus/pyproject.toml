[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spctre-odysseus"
version = "0.1.0"
description = "Spctre ToolMiddleware adapter for Odysseus"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23",
  "pyrefly==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["spctre_odysseus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
