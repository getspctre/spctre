[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spctre-hermes"
version = "0.1.0"
description = "Spctre governance plugin adapter for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Spctre" }]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23.0",
  "pyrefly==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["spctre_hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
