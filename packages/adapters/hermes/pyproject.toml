[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spctre-hermes"
dynamic = ["version"]
description = "Spctre governance plugin adapter for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Spctre" }]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23.0",
  "pyrefly==1.1.0",
]

# Single source of truth for the version: spctre_hermes.__version__ is exported
# on the package and is what the release workflow rewrites for TestPyPI dev
# builds. Keeping it out of this file avoids the two-places-to-bump drift.
[tool.hatch.version]
path = "spctre_hermes/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["spctre_hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
