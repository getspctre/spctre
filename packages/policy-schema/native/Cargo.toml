[package]
name = "spctre_policy_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"

[lib]
name = "spctre_policy_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]
wasm = []

[dependencies]
napi = { version = "2", features = ["napi4"], optional = true }
napi-derive = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
