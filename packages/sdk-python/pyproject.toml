[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spctre-sdk"
dynamic = ["version"]
description = "Python SDK for the Spctre policy operations control plane."
readme = "README.md"
# 3.11, not 3.10: the generated client parses timestamps with
# datetime.fromisoformat, which did not accept the trailing `Z` until 3.11, and
# every API response carries a required meta.ts. Matches the adapter packages.
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Spctre", email = "support@spctre.dev" }]
keywords = ["spctre", "policy", "governance", "agents"]
dependencies = [
  "httpx >= 0.23.0, < 0.29.0",
  "attrs >= 22.2.0",
  "python-dateutil >= 2.8.0",
]

[project.urls]
Homepage = "https://spctre.dev"
Source = "https://github.com/getspctre/spctre"

[project.optional-dependencies]
test = [
  "pytest>=9.0.3",
  "pyrefly==1.1.0",
]

# Single source of truth for the version, matching the adapter packages. The
# release workflow rewrites this file to stamp a .devN suffix for TestPyPI.
[tool.hatch.version]
path = "spctre/_version.py"

# One top-level package. spctre/_generated is generated by
# scripts/generate-python-sdk.sh but IS checked in, so building needs no code
# generator.
[tool.hatch.build.targets.wheel]
packages = ["spctre"]

[tool.hatch.build.targets.sdist]
include = ["spctre", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
# The generated tree is checked by its own generator's conventions, not ours;
# type-checking it would report the generator's style, which we cannot fix.
project-includes = ["spctre", "tests"]
project-excludes = ["spctre/_generated/**"]
# pytest puts the rootdir's tests/ directory on sys.path, which is how the
# test modules import shared helpers from conftest. Tell the checker the same.
search-path = [".", "tests"]
