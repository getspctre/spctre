name: Public CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      web_integration: ${{ steps.filter.outputs.web_integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          git diff --name-only "$base" "$head" > changed-files.txt

          # db/ is included because the Go job migrates the database to run the
          # credential-broker/replay integration tests; a migration change must
          # re-exercise those security-critical paths even if apps/worker/ is
          # untouched.
          if grep -Eq '^(apps/worker|db)/' changed-files.txt; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^packages/policy-schema/native/' changed-files.txt; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

          # apps/web is built from its workspace dependencies (api-contracts,
          # design-tokens, platform, policy-schema, ui — ui also pulls in
          # design-tokens) and from root dependency resolution. A change to any
          # of them, or to the lockfile/workspace manifest, can change web
          # behavior, so the integration job must run in those cases too.
          if grep -Eq '^(apps/web|db|packages/(api-contracts|design-tokens|platform|policy-schema|ui))/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' changed-files.txt; then
            echo "web_integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_integration=false" >> "$GITHUB_OUTPUT"
          fi

  oss:
    name: OSS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm oss:check

  quality:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm --filter @spctre/policy-schema build
      - run: pnpm -r --if-present test --reporter=verbose

      # Report-only coverage baseline for the TypeScript packages. Never fails
      # the build; the number is surfaced in the job summary and archived.
      - name: Coverage — TypeScript packages (report-only)
        continue-on-error: true
        run: |
          pnpm test:coverage
          {
            echo "### Coverage — TypeScript packages"
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log(t.lines.pct+'% lines · '+t.statements.pct+'% statements · '+t.functions.pct+'% functions')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-packages
          path: coverage/
          retention-days: 7

  build-web:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm --filter @spctre/policy-schema build
      # Compiles the client bundle (Turbopack). Catches client/server import
      # violations — e.g. a client-reachable module pulling in node:async_hooks —
      # that the type check and integration tests do not surface.
      - name: Build web (next build)
        run: pnpm --filter @spctre/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  web-integration:
    name: Web integration tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web_integration == 'true'

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: spctre_test
          POSTGRES_USER: spctre
          POSTGRES_PASSWORD: spctre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spctre -d spctre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://spctre:spctre@localhost:5432/spctre_test
      SPCTRE_SESSION_GUARD_SECRET: ci-test-secret
      SPCTRE_CREDENTIAL_ENCRYPTION_KEY: ci-test-credential-encryption-key

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize database roles
        env:
          PGPASSWORD: spctre
        run: psql --host localhost --port 5432 --username spctre --dbname spctre_test --set ON_ERROR_STOP=1 --file docker/init-roles.sql

      - name: Apply migrations
        run: pnpm migrate

      - name: Run web integration tests
        run: pnpm --filter @spctre/web test:integration

      # Report-only coverage for apps/web (reuses this job's Postgres service).
      - name: Coverage — apps/web (report-only)
        continue-on-error: true
        run: |
          pnpm test:coverage:web
          {
            echo "### Coverage — apps/web"
            node -e "const t=require('./apps/web/coverage/coverage-summary.json').total; console.log(t.lines.pct+'% lines · '+t.statements.pct+'% statements · '+t.functions.pct+'% functions')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/web/coverage/
          retention-days: 7

  go-tests:
    name: Go worker tests
    runs-on: ubuntu-latest
    # Installs Node dependencies to run `pnpm migrate` against the Postgres
    # service so the gateway credential-broker/replay integration tests have a
    # migrated database (otherwise they skip).
    needs: changes
    if: needs.changes.outputs.go == 'true'

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: spctre_test
          POSTGRES_USER: spctre
          POSTGRES_PASSWORD: spctre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spctre -d spctre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Consumed by `pnpm migrate` and by the Go integration tests' DB harness.
      DATABASE_URL: postgres://spctre:spctre@localhost:5432/spctre_test
      SPCTRE_CREDENTIAL_ENCRYPTION_KEY: ci-test-credential-encryption-key

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize database roles
        env:
          PGPASSWORD: spctre
        run: psql --host localhost --port 5432 --username spctre --dbname spctre_test --set ON_ERROR_STOP=1 --file docker/init-roles.sql

      - name: Apply migrations
        run: pnpm migrate

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/worker/go.mod
          cache-dependency-path: apps/worker/go.sum

      - name: Run Go tests
        run: go test -coverprofile=cover.out ./...
        working-directory: apps/worker

      # Report-only coverage for the Go worker.
      - name: Coverage — Go worker (report-only)
        continue-on-error: true
        working-directory: apps/worker
        run: |
          {
            echo "### Coverage — Go worker"
            go tool cover -func=cover.out | tail -1
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: apps/worker/cover.out
          retention-days: 7

      # Advisory cyclomatic-complexity report (non-blocking) mirroring the
      # warn-level ESLint complexity rules on the TS side. Surfaces regressions
      # at PR time without failing the build on pre-existing hotspots.
      - name: Cyclomatic complexity report (advisory)
        continue-on-error: true
        run: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -over 20 -ignore '_test|_gen' .
        working-directory: apps/worker

  rust-tests:
    name: Rust native policy-core tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/policy-schema/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/policy-schema/native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test
        working-directory: packages/policy-schema/native

  code-health:
    name: Code health (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Advisory (non-blocking) drift detection. Surfaces dead code and
      # duplication at PR time; the Go/TS complexity guards live in the go-tests
      # and quality jobs. Promote to blocking once the baselines are clean.
      - name: Dead code (knip)
        continue-on-error: true
        run: pnpm lint:deadcode

      - name: Duplication (jscpd)
        continue-on-error: true
        run: pnpm lint:duplication

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify commits are signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for commit in $(git log --format=%H "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              missing="${missing}${commit}\n"
            fi
          done
          if [ -n "$missing" ]; then
            echo "The following commits are missing DCO Signed-off-by trailers:"
            echo -e "$missing"
            exit 1
          fi
