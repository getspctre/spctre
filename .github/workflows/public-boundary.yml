name: Public boundary

on:
  push:
    branches: [main]
  # Unfiltered by base branch so stacked pull requests are checked too; see the
  # note on the same trigger in ci.yml.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-public-boundary.mjs
