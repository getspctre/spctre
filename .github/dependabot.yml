version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # fumadocs-core and fumadocs-ui are released in lockstep and must move
      # together. Bumped apart, the lockfile keeps a copy of each core version:
      # RootProvider resolves its search client against the copy fumadocs-ui
      # depends on, while apps/docs imports fumadocs-core/search/server from the
      # other, and prerendering dies with "staticClient is not a function" on
      # every page. Dependabot raises one PR per package and cannot see the
      # coupling, so the group is what keeps them in one PR.
      fumadocs:
        patterns:
          - "fumadocs*"
          - "@fumadocs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    ignore:
      # A changesets/action major is coupled to the Changesets CLI major: the
      # action refuses to run against the previous CLI and renames the inputs
      # release.yml passes. Unknown `with:` keys are only a warning, so a missed
      # rename does not fail the step — it runs with no version script at all.
      #
      # None of that is catchable by PR CI, because release.yml runs on push to
      # main rather than on pull_request: the bump merges green and then fails
      # every release afterwards, which is exactly what v2 did here. Take these
      # deliberately, with the CLI bump in the same change.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
