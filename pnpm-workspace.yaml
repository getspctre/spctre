packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"

overrides:
  postcss>nanoid: 3.3.18
  '@scalar/types>nanoid': 5.1.16
  '@grpc/grpc-js': '>=1.14.4'
  # Also a floor. 857b24bc pinned this at 1.18.1 to clear an advisory, but an
  # exact override outranks a declared range, so when Dependabot #260 raised
  # packages/mcp-server to `^1.20.0` the lockfile stayed on 1.18.1 — a version
  # the manifest no longer permits. The bump merged and changed nothing.
  axios: '>=1.20.0'
  axios>form-data: 4.0.6
  esbuild: 0.28.1
  '@types/request>form-data': 2.5.6
  # Floors, not pins. As exact versions these outranked the manifests, and
  # auto-instrumentations-node proved it: the packages asked for ^0.79.0 while
  # the lockfile stayed on 0.78.0, a version they no longer permit, so the bump
  # that raised them changed nothing. Same correction as @grpc/grpc-js and axios.
  '@opentelemetry/core': '>=2.8.0'
  '@opentelemetry/sdk-node': '>=0.220.0'
  '@opentelemetry/auto-instrumentations-node': '>=0.78.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  # A floor, not a pin. This was `4.12.34`, which cleared an advisory when it was
  # written and then became one: an exact override outranks whatever a manifest
  # asks for, so the lockfile could not leave 4.12.34 until this line did.
  hono: ^4.13.5
  '@hono/node-server': 2.0.12
  ip-address: 10.3.1
  # Kept inside their own majors: the selector only decides which requests are
  # rewritten, so an open floor here would answer a 3.x request with 5.x.
  js-yaml@^4.0.0: ^4.3.2
  js-yaml@<3.15.2: ^3.15.2
  postcss: 8.5.23
  protobufjs: 8.6.6
  shell-quote: 1.9.0
  body-parser@1: 1.20.6
  body-parser@2: 2.3.0
  uuid: 11.1.1
  ws: ^8.21.0
  joi: ^17.13.4
  '@babel/core': ^7.29.6
  brace-expansion: 5.0.9
  browserslist: 4.28.8
  # A floor, not a pin. This entry was `3.1.5` — correct when 857b24bc added it,
  # and the reason four later high advisories (host confusion via skipped IDN
  # and via percent-encoded scheme normalization, plus two SSRF paths) stayed
  # live: an exact override outranks the `^3.0.1` its only consumer, ajv,
  # declares, so it held the tree at a version the ecosystem had already moved
  # off. ajv 8.20.0 is the latest release, so nothing upstream would have
  # dislodged it either.
  #
  # A floor lets the next patch in without another advisory first, and it
  # composes with the maturity hold below rather than fighting it: pnpm
  # resolves to the newest version past the hold, so this currently lands on
  # 3.1.6 while 3.1.7 matures instead of failing the install.
  fast-uri: '>=3.1.6'
  # express 4 and its body-parser both declare `~6.15.1`, which excludes the
  # 6.16.0 that patches the two advisories the lockfile was carrying. An
  # override is the only way past a range that stops short of the fix.
  #
  # Scoped to a floor rather than an exact version, per the reasoning above,
  # and deliberately not applied as a bare `qs` bump: @xmldom/xmldom needed no
  # entry here at all, because its consumer's range already admitted the
  # patched release and a plain lockfile update reached it. Prefer that when it
  # works — an override is a standing commitment to re-check by hand.
  qs: '>=6.16.0'
  websocket-driver: 0.7.5
  # A floor, not a pin, and the reason this needed changing rather than adding:
  # an exact override outranks whatever next asks for, so pinning 0.35.3 held
  # sharp *at* the version carrying GHSA-g89c-p67h-r497 and GHSA-2jg2-4ch7-h545
  # and no upstream bump could lift it. Same shape as the axios entry above.
  sharp: '>=0.35.4'

# Hold newly published dependency versions for 3 days before normal installs.
# This gives the ecosystem time to detect and yank compromised releases.
minimumReleaseAge: 4320

# MCP SDK v2 is required for the stateless 2026-07-28 protocol GA. Keep the
# maturity hold for all other dependencies while permitting this reviewed scope.
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/*'

# Packages allowed to run lifecycle build scripts during install. Keep this
# list small and review any additions as supply-chain risk exceptions.
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

pmOnFail: ignore

auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
